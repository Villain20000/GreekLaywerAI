# NomosAI Promtail configuration (3-1 observability).
#
# Discovers containers through the read-only Docker socket and tails their
# json-file logs from /var/lib/docker/containers (the path is derived from the
# container ID). Labels:
#   container  Docker container name (leading slash stripped)
#   service    compose service name (com.docker.compose.service)
#   stream     stdout/stderr
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_id']
        target_label: __path__
        replacement: '/var/lib/docker/containers/$1/*-json.log'
    pipeline_stages:
      - docker: {}
