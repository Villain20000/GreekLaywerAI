name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Run backend tests
        working-directory: backend
        run: npm test
      - name: Audit backend runtime dependencies
        working-directory: backend
        # Gates on critical runtime advisories. Remaining high advisories are
        # dev-only or need semver-major upgrades (tracked by Dependabot).
        run: npm audit --omit=dev --audit-level=critical
      - name: Build backend Docker image
        run: docker build -t nomosai-backend:ci ./backend

  frontend:
    name: Frontend (ng test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Chrome for Karma
        working-directory: frontend
        # karma.conf.js resolves CHROME_BIN through puppeteer.executablePath().
        run: npx puppeteer browsers install chrome
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build frontend Docker image
        run: docker build -t nomosai-frontend:ci ./frontend
