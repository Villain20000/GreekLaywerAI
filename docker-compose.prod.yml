
services:
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: nomos_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_prod_password}
      POSTGRES_DB: nomos_db
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - nomos-prod-network
    restart: always

  # Phase 29: Redis with AOF persistence.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata_prod:/data
    networks:
      - nomos-prod-network
    restart: always

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=nomos_admin
      - DB_PASSWORD=${DB_PASSWORD:-secure_prod_password}
      - DB_NAME=nomos_db
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=bge-m3
      - OLLAMA_EMBED_DIM=1024
      - OLLAMA_CHAT_MODEL=gemma2b-mmap
      # Phase 1-6: local speech-to-text (see the `whisper` sidecar below).
      # Audio stays on the deployment; WHISPER_URL can point at an external
      # OpenAI-compatible STT service if one is provided deliberately.
      - WHISPER_URL=${WHISPER_URL:-http://whisper:8000}
      - WHISPER_MODEL=${WHISPER_MODEL:-Systran/faster-whisper-base}
      - WHISPER_TIMEOUT_MS=${WHISPER_TIMEOUT_MS:-120000}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PRICE_ID_BASIC=${STRIPE_PRICE_ID_BASIC:-}
      - STRIPE_PRICE_ID_PRO=${STRIPE_PRICE_ID_PRO:-}
      - STRIPE_PRICE_ID_ENTERPRISE=${STRIPE_PRICE_ID_ENTERPRISE:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set for production}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://your-domain.gr}
      - APP_BASE_URL=${APP_BASE_URL:-https://your-domain.gr}
      # P0-6: production email is mandatory — the backend refuses to boot
      # without SMTP configured (verification + reset emails are otherwise
      # silently undeliverable). SMTP_HOST/EMAIL_FROM are required at
      # compose time so misconfiguration fails before containers start.
      - EMAIL_TRANSPORT=smtp
      - EMAIL_FROM=${EMAIL_FROM:?EMAIL_FROM must be set for production}
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST must be set for production}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - TRUST_PROXY=uniquelocal,loopback
      - RETENTION_CONVERSATIONS_DAYS=${RETENTION_CONVERSATIONS_DAYS:-365}
      - RETENTION_DOCUMENTS_DAYS=${RETENTION_DOCUMENTS_DAYS:-365}
      - RETENTION_AUDIT_LOG_DAYS=${RETENTION_AUDIT_LOG_DAYS:-90}
      - ADMIN_MAGIC_LINK_ENABLED=${ADMIN_MAGIC_LINK_ENABLED:-false}
      # Phase 1-8: scraper output consumed by the ingest script; bind-mounted
      # read-only below. Regenerate on the host and re-run the ingest command.
      - SCRAPED_LAWS_PATH=/usr/src/app/scraped_laws.json
    volumes:
      - ./scraped_laws.json:/usr/src/app/scraped_laws.json:ro
    depends_on:
      - db
      - redis
      - ollama
      - whisper
    networks:
      - nomos-prod-network
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80" # nginx serves the production bundle on port 80
    depends_on:
      - backend
    networks:
      - nomos-prod-network
    restart: always

  # Production Ollama with GPU Pass-through enabled via NVIDIA Container Toolkit
  # Note: on CPU-only hosts, `gemma2b-mmap` (gemma:2b with use_mmap true)
  # avoids the --no-mmap CPU_REPACK crash on low-RAM machines.
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models_prod:/root/.ollama
    networks:
      - nomos-prod-network
    restart: always
    entrypoint:
      - /bin/sh
      - -c
      - "ollama serve & sleep 5 && ollama pull bge-m3 && ollama pull gemma:2b && printf 'FROM gemma:2b\nPARAMETER use_mmap true\n' > /tmp/gemma-mmap.Modelfile && ollama create gemma2b-mmap -f /tmp/gemma-mmap.Modelfile && wait"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q bge-m3 && ollama list | grep -q gemma2b-mmap"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Phase 1-6: local speech-to-text (STT) sidecar. Same OpenAI-compatible
  # speaches/faster-whisper image as dev, CPU variant (no GPU reservation —
  # GPU is reserved for the chat/embedding Ollama above). No published ports:
  # audio only travels over the internal compose network.
  #
  # Model: `Systran/faster-whisper-base`, pre-downloaded into the named cache
  # volume at boot. Bump WHISPER_MODEL + PRELOAD_MODELS together (and
  # WHISPER_TIMEOUT_MS for long clips). CPU-only caveat: `base` transcribes at
  # roughly 1–3× real time on a 4-core host, so a 10-minute recording can take
  # minutes — size the deploy (or switch to the CUDA image) accordingly.
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    environment:
      - WHISPER__INFERENCE_DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=int8
      - 'PRELOAD_MODELS=["${WHISPER_MODEL:-Systran/faster-whisper-base}"]'
    volumes:
      - whisper_cache_prod:/home/ubuntu/.cache/huggingface/hub
    networks:
      - nomos-prod-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  # Phase 29: daily DB backup (pg_dump, custom format). Wire the cron
  # inside the container to run backupDb.js at 02:00.
  backup:
    image: node:20-alpine
    volumes:
      - ./backend:/app/backend
      - ./database:/app/database
      - backups_prod:/backups
      - prom_textfile_prod:/prom-textfile
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=nomos_admin
      - DB_PASSWORD=${DB_PASSWORD:-secure_prod_password}
      - DB_NAME=nomos_db
      - BACKUP_DIR=/backups
      # 3-1: publish backup freshness for the BackupStale alert. The path is
      # a named volume read by node_exporter's textfile collector below.
      - PROM_TEXTFILE_DIR=/prom-textfile
    entrypoint: >
      /bin/sh -c "apk add --no-cache postgresql-client > /dev/null 2>&1
      && echo '0 2 * * * cd /app/backend && node src/scripts/backupDb.js' > /etc/crontabs/root
      && crond -f"
    depends_on:
      - db
    networks:
      - nomos-prod-network
    restart: always

  # 1-5: daily data-retention sweep. Mirrors the `backup` cron sidecar:
  # runs `retentionCleanup.js` at 03:00 inside the container. The script
  # prints a per-table summary and records it via the audit log.
  # Semantics: conversations are pruned by updated_at (active chats
  # survive), legal_documents + audit_log by created_at.
  retention:
    image: node:20-alpine
    volumes:
      - ./backend:/app/backend
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=nomos_admin
      - DB_PASSWORD=${DB_PASSWORD:-secure_prod_password}
      - DB_NAME=nomos_db
      - RETENTION_CONVERSATIONS_DAYS=${RETENTION_CONVERSATIONS_DAYS:-365}
      - RETENTION_DOCUMENTS_DAYS=${RETENTION_DOCUMENTS_DAYS:-365}
      - RETENTION_AUDIT_LOG_DAYS=${RETENTION_AUDIT_LOG_DAYS:-90}
    entrypoint: >
      /bin/sh -c "echo '0 3 * * * cd /app/backend && node src/scripts/retentionCleanup.js' > /etc/crontabs/root
      && crond -f"
    depends_on:
      - db
    networks:
      - nomos-prod-network
    restart: always

  # 3-1: observability stack. Prometheus and both exporters are internal-only
  # (no published ports). Grafana binds to localhost only; access it through
  # an SSH tunnel (`ssh -L 3001:127.0.0.1:3001 user@host`) or a reverse proxy
  # with TLS/auth. Dashboards and datasources are provisioned read-only.
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    networks:
      - nomos-prod-network
    restart: always

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - nomos-prod-network
    restart: always

  # Redis signal for the RedisDown alert (redis_up).
  redis_exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    networks:
      - nomos-prod-network
    restart: always

  # Host disk/CPU/memory plus the backup-freshness textfile collector. The
  # backup sidecar writes nomos_backup.prom into the shared prom_textfile_prod
  # volume; node_exporter exposes it as nomos_backup_last_success_timestamp_seconds.
  node_exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - '--path.rootfs=/host'
      - '--collector.textfile.directory=/prom-textfile'
    pid: host
    volumes:
      - /:/host:ro,rslave
      - prom_textfile_prod:/prom-textfile:ro
    networks:
      - nomos-prod-network
    restart: always

volumes:
  pgdata_prod:
  redisdata_prod:
  ollama_models_prod:
  whisper_cache_prod:
  backups_prod:
  prometheus_data:
  grafana_data:
  prom_textfile_prod:

networks:
  nomos-prod-network:
    driver: bridge
