
services:
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: nomos_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_prod_password}
      POSTGRES_DB: nomos_db
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - nomos-prod-network
    restart: always

  # Phase 29: Redis with AOF persistence.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata_prod:/data
    networks:
      - nomos-prod-network
    restart: always

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=nomos_admin
      - DB_PASSWORD=${DB_PASSWORD:-secure_prod_password}
      - DB_NAME=nomos_db
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=bge-m3
      - OLLAMA_EMBED_DIM=1024
      - OLLAMA_CHAT_MODEL=gemma2b-mmap
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PRICE_ID_BASIC=${STRIPE_PRICE_ID_BASIC:-}
      - STRIPE_PRICE_ID_PRO=${STRIPE_PRICE_ID_PRO:-}
      - STRIPE_PRICE_ID_ENTERPRISE=${STRIPE_PRICE_ID_ENTERPRISE:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set for production}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://your-domain.gr}
      - APP_BASE_URL=${APP_BASE_URL:-https://your-domain.gr}
      - TRUST_PROXY=uniquelocal,loopback
      - RETENTION_CONVERSATIONS_DAYS=${RETENTION_CONVERSATIONS_DAYS:-365}
      - RETENTION_DOCUMENTS_DAYS=${RETENTION_DOCUMENTS_DAYS:-365}
      - RETENTION_AUDIT_LOG_DAYS=${RETENTION_AUDIT_LOG_DAYS:-90}
      - ADMIN_MAGIC_LINK_ENABLED=${ADMIN_MAGIC_LINK_ENABLED:-false}
    depends_on:
      - db
      - redis
      - ollama
    networks:
      - nomos-prod-network
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:4200" # Mapping to port 80 for production access
    depends_on:
      - backend
    networks:
      - nomos-prod-network
    restart: always

  # Production Ollama with GPU Pass-through enabled via NVIDIA Container Toolkit
  # Note: on CPU-only hosts, `gemma2b-mmap` (gemma:2b with use_mmap true)
  # avoids the --no-mmap CPU_REPACK crash on low-RAM machines.
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models_prod:/root/.ollama
    networks:
      - nomos-prod-network
    restart: always
    entrypoint:
      - /bin/sh
      - -c
      - "ollama serve & sleep 5 && ollama pull bge-m3 && ollama pull gemma:2b && printf 'FROM gemma:2b\nPARAMETER use_mmap true\n' > /tmp/gemma-mmap.Modelfile && ollama create gemma2b-mmap -f /tmp/gemma-mmap.Modelfile && wait"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q bge-m3 && ollama list | grep -q gemma2b-mmap"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Phase 29: daily DB backup (pg_dump, custom format). Wire the cron
  # inside the container to run backupDb.js at 02:00.
  backup:
    image: node:20-alpine
    volumes:
      - ./backend:/app/backend
      - ./database:/app/database
      - backups_prod:/backups
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=nomos_admin
      - DB_PASSWORD=${DB_PASSWORD:-secure_prod_password}
      - DB_NAME=nomos_db
      - BACKUP_DIR=/backups
    entrypoint: >
      /bin/sh -c "apk add --no-cache postgresql-client > /dev/null 2>&1
      && echo '0 2 * * * cd /app/backend && node src/scripts/backupDb.js' > /etc/crontabs/root
      && crond -f"
    depends_on:
      - db
    networks:
      - nomos-prod-network
    restart: always

  # Phase 29: monitoring stack (Prometheus scrapes /metrics, Grafana charts).
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - nomos-prod-network
    restart: always

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - nomos-prod-network
    restart: always

volumes:
  pgdata_prod:
  redisdata_prod:
  ollama_models_prod:
  backups_prod:
  prometheus_data:
  grafana_data:

networks:
  nomos-prod-network:
    driver: bridge
