apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nomosai
  namespace: nomosai
  labels:
    app.kubernetes.io/name: nomosai
    app.kubernetes.io/part-of: nomosai
  annotations:
    # 25 MB document limit; long timeouts for AI requests and SSE.
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Origin-side flood protection (matches the compose Traefik middleware).
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    # Uncomment when cert-manager issues the certificate:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.example.com
      secretName: nomosai-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
