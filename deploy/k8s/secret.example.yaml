# Example only. Copy locally, replace every value, and never commit the
# resulting secret. Apply it with:
#   kubectl apply -f deploy/k8s/secret.yaml
#
# Alternatively create it imperatively:
#   kubectl -n nomosai create secret generic nomosai-secrets \
#     --from-literal=DB_PASSWORD=... --from-literal=JWT_SECRET=...
apiVersion: v1
kind: Secret
metadata:
  name: nomosai-secrets
  namespace: nomosai
  labels:
    app.kubernetes.io/name: nomosai
    app.kubernetes.io/part-of: nomosai
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_WITH_LONG_RANDOM_DB_PASSWORD"
  JWT_SECRET: "REPLACE_WITH_OPENSSL_RAND_HEX_64"
  STRIPE_SECRET_KEY: "REPLACE_WITH_LIVE_STRIPE_SECRET_KEY"
  STRIPE_WEBHOOK_SECRET: "REPLACE_WITH_STRIPE_WEBHOOK_SECRET"
  SMTP_USER: ""
  SMTP_PASS: ""
  SENTRY_DSN: ""
