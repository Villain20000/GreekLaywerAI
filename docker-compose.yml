
services:
  # Database with pgvector
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: nomos_admin
      POSTGRES_PASSWORD: nomos_password
      POSTGRES_DB: nomos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - nomos-network

  # Node.js Backend
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=nomos_admin
      - DB_PASSWORD=nomos_password
      - DB_NAME=nomos_db
      - OLLAMA_URL=http://ollama:11434
      # Phase 31: dedicated embed model used by RAG (must be `ollama pull`ed
      # once). Default `bge-m3` emits 1024-dim vectors which match the
      # `legislation_embeddings.embedding vector(1024)` column. Swap from
      # `nomic-embed-text` (768-dim, weak cross-lingual) to `bge-m3` for
      # properly multilingual alignment — Greek-language queries now retrieve
      # Greek-titled legislation correctly.
      - OLLAMA_EMBED_MODEL=bge-m3
      - OLLAMA_EMBED_DIM=1024
      - OLLAMA_CHAT_MODEL=gemma2b-mmap
      - STRIPE_SECRET_KEY=sk_test_mock
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-nomos-super-secret-key-development}
      # Dev: no CORS_ORIGINS → backend allows all origins (see src/index.js).
      # Set CORS_ORIGINS (comma-separated) for a locked-down deployment.
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - APP_BASE_URL=http://localhost:4200
      - STRIPE_PRICE_ID_BASIC=${STRIPE_PRICE_ID_BASIC:-}
      - STRIPE_PRICE_ID_PRO=${STRIPE_PRICE_ID_PRO:-}
      - STRIPE_PRICE_ID_ENTERPRISE=${STRIPE_PRICE_ID_ENTERPRISE:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      ollama:
        condition: service_healthy
    networks:
      - nomos-network

  # Redis for BullMQ — Phase 29: AOF persistence so queued inference jobs
  # survive container restarts.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - nomos-network

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - nomos-network

  # Ollama for Gemma 4 Runtime (with GPU pass-through if available)
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - nomos-network
    # Phase 31: pull the models at first boot so RAG + chat work out of the
    # box. `bge-m3` emits 1024-dim vectors matching the pgvector schema.
    # `gemma2b-mmap` is gemma:2b re-declared with `use_mmap true`: on CPU
    # ollama force-loads with --no-mmap, whose CPU_REPACK path dies with
    # SIGTERM on low-RAM hosts — mmap keeps the weights page-cache backed.
    entrypoint:
      - /bin/sh
      - -c
      - "ollama serve & sleep 5 && ollama pull bge-m3 && ollama pull gemma:2b && printf 'FROM gemma:2b\nPARAMETER use_mmap true\n' > /tmp/gemma-mmap.Modelfile && ollama create gemma2b-mmap -f /tmp/gemma-mmap.Modelfile && wait"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q bge-m3 && ollama list | grep -q gemma2b-mmap"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 30s
    # To enable GPU acceleration, uncomment the deploy section below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  pgdata:
  redisdata:
  ollama_data:

networks:
  nomos-network:
    driver: bridge
