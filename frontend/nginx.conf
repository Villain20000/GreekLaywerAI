server {
    listen 80;
    # Kubernetes runs the container as non-root; 8080 is unprivileged. The
    # compose stacks keep using port 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Document uploads are capped at 25 MB by the backend; the nginx default
    # (1 MB) would reject PDFs long before the request reaches Express.
    client_max_body_size 25m;

    # Restore the real client IP when Cloudflare is the public edge. The
    # ranges live in deploy/cloudflare/real-ip.conf and are mounted by the
    # compose stacks; the wildcard include keeps the image runnable without it.
    include /etc/nginx/cloudflare/*.conf;

    # Basic static hardening. Repeated in locations that define their own
    # add_header (nginx does not inherit parent headers once a child sets one).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    # ── Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # ── Health probe (used by Docker HEALTHCHECK / orchestrators) ───────
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        return 200 "ok\n";
    }

    # ── API reverse proxy ───────────────────────────────────────────────
    # `^~` prevents the static-asset regex below from ever intercepting
    # /api/ requests. proxy_buffering is off so long-running AI/job-polling
    # responses reach the browser as soon as they are produced.
    location ^~ /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    }

    # ── PWA manifest ────────────────────────────────────────────────────
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        try_files $uri =404;
    }

    # The Angular service worker and its manifest must always be fetched so
    # a new deployment can take over on the next visit.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        try_files $uri =404;
    }

    location = /ngsw.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        try_files $uri =404;
    }

    # ── SEO files ───────────────────────────────────────────────────────
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        try_files $uri =404;
    }

    # ── Immutable, content-hashed build artefacts ───────────────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|svg|png|jpe?g|gif|webp|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deployments are picked
    # up immediately instead of serving a stale bundle reference.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    }

    # ── SPA fallback ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    }
}
