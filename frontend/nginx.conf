server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Document uploads are capped at 25 MB by the backend; the nginx default
    # (1 MB) would reject PDFs long before the request reaches Express.
    client_max_body_size 25m;

    # ── Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # ── Health probe (used by Docker HEALTHCHECK / orchestrators) ───────
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── API reverse proxy ───────────────────────────────────────────────
    # `^~` prevents the static-asset regex below from ever intercepting
    # /api/ requests. proxy_buffering is off so long-running AI/job-polling
    # responses reach the browser as soon as they are produced.
    location ^~ /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Immutable, content-hashed build artefacts ───────────────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|svg|png|jpe?g|gif|webp|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deployments are picked
    # up immediately instead of serving a stale bundle reference.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ── SPA fallback ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
