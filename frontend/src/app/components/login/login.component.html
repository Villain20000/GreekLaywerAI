<div class="login-container">
  <div class="login-box">
    <div class="brand-row">
      <span class="brand-mark" aria-hidden="true">§</span>
      <span class="brand-text">NomosAI</span>
    </div>

    <h2>{{ 'auth.login.title' | translate }}</h2>
    <p>{{ 'auth.login.subtitle' | translate }}</p>

    <div class="form-group">
      <label for="login-email">{{ 'common.email' | translate }}</label>
      <input
        id="login-email"
        type="email"
        [(ngModel)]="email"
        name="email"
        [attr.placeholder]="'auth.login.emailPlaceholder' | translate"
        autocomplete="email"
        (keyup.enter)="onSubmit()"
      />
    </div>
    <div class="form-group">
      <label for="login-password">{{ 'common.password' | translate }}</label>
      <div class="password-row">
        <input
          id="login-password"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          [attr.placeholder]="'auth.login.passwordPlaceholder' | translate"
          autocomplete="current-password"
          (keyup.enter)="onSubmit()"
        />
        <button
          type="button"
          class="peek-btn"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? ('common.hidePassword' | translate) : ('common.showPassword' | translate)"
          [attr.aria-pressed]="showPassword"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path *ngIf="!showPassword"
              d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" />
            <path *ngIf="showPassword"
              d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16c.57-.23 1.18-.36 1.83-.36zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53a5 5 0 0 1-5-5c0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16a3 3 0 0 0-3-3l-.17.01z" />
          </svg>
        </button>
      </div>
    </div>

    <div *ngIf="error" class="error-msg" role="alert" aria-live="assertive">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="msg-icon">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
      </svg>
      <span>{{ error }}</span>
      <a *ngIf="lastFailedKind === 'invalid_credentials'"
         routerLink="/forgot-password"
         queryParamsHandling="preserve"
         class="inline-link">{{ 'auth.login.forgotIt' | translate }}</a>
    </div>

    <button class="primary" (click)="onSubmit()" [disabled]="isLoading">
      <span *ngIf="!isLoading">{{ 'auth.login.signIn' | translate }}</span>
      <span *ngIf="isLoading">
        <span class="spinner" aria-hidden="true"></span>
        {{ 'auth.login.authenticating' | translate }}
      </span>
    </button>

    <div *ngIf="showResend" class="resend-panel">
      <button class="secondary" (click)="onResend()" [disabled]="resendIsLoading">
        <span *ngIf="!resendIsLoading">{{ 'auth.login.resend' | translate }}</span>
        <span *ngIf="resendIsLoading">
          <span class="spinner" aria-hidden="true"></span>
          {{ 'auth.login.sending' | translate }}
        </span>
      </button>
      <div *ngIf="resendMessage" class="success-msg" role="status" aria-live="polite">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="msg-icon">
          <path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
        </svg>
        <span>{{ resendMessage }}</span>
      </div>
    </div>

    <div class="auth-links" role="navigation" [attr.aria-label]="'auth.authOptions' | translate">
      <a routerLink="/forgot-password" class="auth-link">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="auth-link-icon">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" />
        </svg>
        <span>{{ 'auth.login.forgotPassword' | translate }}</span>
      </a>
      <span class="auth-links-divider" aria-hidden="true"></span>
      <a routerLink="/register" queryParamsHandling="preserve" class="auth-link">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="auth-link-icon">
          <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
        </svg>
        <span>{{ 'auth.login.createAccount' | translate }}</span>
      </a>
    </div>
  </div>
</div>
