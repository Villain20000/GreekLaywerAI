<div class="change-password-container">
  <div class="change-password-box">
    <div class="brand-row">
      <span class="brand-mark" aria-hidden="true">§</span>
      <span class="brand-text">NomosAI</span>
    </div>

    <h2>{{ 'auth.change.title' | translate }}</h2>
    <p>{{ 'auth.change.subtitle' | translate }}</p>

    <div class="form-group">
      <label for="current-password">{{ 'common.currentPassword' | translate }}</label>
      <div class="password-row">
        <input
          id="current-password"
          [type]="showCurrent ? 'text' : 'password'"
          [(ngModel)]="currentPassword"
          name="currentPassword"
          autocomplete="current-password"
          [attr.placeholder]="'auth.change.currentPlaceholder' | translate"
          (keyup.enter)="onSubmit()"
        />
        <button
          type="button"
          class="peek-btn"
          (click)="toggleCurrent()"
          [attr.aria-label]="showCurrent ? ('common.hideCurrentPassword' | translate) : ('common.showCurrentPassword' | translate)"
          [attr.aria-pressed]="showCurrent"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path *ngIf="!showCurrent"
              d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" />
            <path *ngIf="showCurrent"
              d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16c.57-.23 1.18-.36 1.83-.36zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53a5 5 0 0 1-5-5c0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16a3 3 0 0 0-3-3l-.17.01z" />
          </svg>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label for="new-password">{{ 'common.newPassword' | translate }}</label>
      <div class="password-row">
        <input
          id="new-password"
          [type]="showNew ? 'text' : 'password'"
          [(ngModel)]="newPassword"
          name="newPassword"
          autocomplete="new-password"
          [attr.placeholder]="'auth.change.newPasswordPlaceholder' | translate"
          (keyup.enter)="onSubmit()"
        />
        <button
          type="button"
          class="peek-btn"
          (click)="toggleNew()"
          [attr.aria-label]="showNew ? ('common.hideNewPassword' | translate) : ('common.showNewPassword' | translate)"
          [attr.aria-pressed]="showNew"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path *ngIf="!showNew"
              d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" />
            <path *ngIf="showNew"
              d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16c.57-.23 1.18-.36 1.83-.36zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53a5 5 0 0 1-5-5c0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16a3 3 0 0 0-3-3l-.17.01z" />
          </svg>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label for="confirm-new-password">{{ 'common.confirmPassword' | translate }}</label>
      <div class="password-row">
        <input
          id="confirm-new-password"
          [type]="showConfirm ? 'text' : 'password'"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          autocomplete="new-password"
          [attr.placeholder]="'auth.change.confirmPlaceholder' | translate"
          (keyup.enter)="onSubmit()"
        />
        <button
          type="button"
          class="peek-btn"
          (click)="toggleConfirm()"
          [attr.aria-label]="showConfirm ? ('common.hideConfirmPassword' | translate) : ('common.showConfirmPassword' | translate)"
          [attr.aria-pressed]="showConfirm"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path *ngIf="!showConfirm"
              d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" />
            <path *ngIf="showConfirm"
              d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16c.57-.23 1.18-.36 1.83-.36zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53a5 5 0 0 1-5-5c0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16a3 3 0 0 0-3-3l-.17.01z" />
          </svg>
        </button>
      </div>
    </div>

    <div *ngIf="success" class="success-msg" role="status" aria-live="polite">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="msg-icon">
        <path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
      </svg>
      <span>{{ 'auth.change.success' | translate }}</span>
    </div>
    <div *ngIf="error" class="error-msg" role="alert" aria-live="assertive">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="msg-icon">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
      </svg>
      <span>{{ error }}</span>
    </div>

    <button class="primary" (click)="onSubmit()" [disabled]="isLoading">
      <span *ngIf="!isLoading">{{ 'auth.change.update' | translate }}</span>
      <span *ngIf="isLoading">
        <span class="spinner" aria-hidden="true"></span>
        {{ 'auth.change.updating' | translate }}
      </span>
    </button>

    <div class="auth-links" role="navigation" [attr.aria-label]="'auth.authOptions' | translate">
      <a routerLink="/chat" class="auth-link">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="auth-link-icon">
          <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8h16v10zm-2-6h-2v2h-2v-2h-2V8h2V6h2v2h2v6z" />
        </svg>
        <span>{{ 'auth.change.backToWorkspace' | translate }}</span>
      </a>
    </div>
  </div>
</div>
