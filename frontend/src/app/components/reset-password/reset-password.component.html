<div class="reset-container">
  <div class="reset-box">
    <h2>Reset Password</h2>
    <p>Set a new password for your NomosAI account.</p>
    <div *ngIf="!token" class="error-msg" role="status" aria-live="polite">Missing reset token. Please use the link from your reset email.</div>
    <ng-container *ngIf="token">
      <div class="form-group">
        <label for="reset-new-password">New password</label>
        <input
          id="reset-new-password"
          type="password"
          [(ngModel)]="newPassword"
          name="newPassword"
          autocomplete="new-password"
          placeholder="At least 8 characters"
        />
      </div>
      <div class="form-group">
        <label for="reset-confirm-password">Confirm new password</label>
        <input
          id="reset-confirm-password"
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          autocomplete="new-password"
          placeholder="Repeat your new password"
        />
      </div>
      <div *ngIf="error" class="error-msg" role="alert" aria-live="assertive">{{ error }}</div>
      <div *ngIf="success" class="success-msg" role="status" aria-live="polite">Password reset. Signing you in &hellip;</div>
      <button (click)="onSubmit()" [disabled]="isLoading">{{ isLoading ? 'Resetting...' : 'Reset password' }}</button>
    </ng-container>
    <p class="footer-link"><a routerLink="/login">&larr; Back to sign in</a></p>
  </div>
</div>
