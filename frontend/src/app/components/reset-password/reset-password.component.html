<div class="reset-container">
  <div class="reset-box">
    <h2>{{ 'auth.reset.title' | translate }}</h2>
    <p>{{ 'auth.reset.subtitle' | translate }}</p>
    <div *ngIf="!token" class="error-msg" role="status" aria-live="polite">{{ 'auth.reset.missingToken' | translate }}</div>
    <ng-container *ngIf="token">
      <div class="form-group">
        <label for="reset-new-password">{{ 'common.newPassword' | translate }}</label>
        <input
          id="reset-new-password"
          type="password"
          [(ngModel)]="newPassword"
          name="newPassword"
          autocomplete="new-password"
          [attr.placeholder]="'auth.reset.newPasswordPlaceholder' | translate"
        />
      </div>
      <div class="form-group">
        <label for="reset-confirm-password">{{ 'common.confirmPassword' | translate }}</label>
        <input
          id="reset-confirm-password"
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          autocomplete="new-password"
          [attr.placeholder]="'auth.reset.confirmPlaceholder' | translate"
        />
      </div>
      <div *ngIf="error" class="error-msg" role="alert" aria-live="assertive">{{ error }}</div>
      <div *ngIf="success" class="success-msg" role="status" aria-live="polite">{{ 'auth.reset.success' | translate }}</div>
      <button class="primary" (click)="onSubmit()" [disabled]="isLoading">{{ (isLoading ? 'auth.reset.resetting' : 'auth.reset.submit') | translate }}</button>
    </ng-container>
    <p class="footer-link"><a routerLink="/login">{{ 'common.backToSignIn' | translate }}</a></p>
  </div>
</div>
