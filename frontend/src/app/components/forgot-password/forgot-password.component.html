<div class="forgot-container">
  <div class="forgot-box">
    <h2>Forgot Password</h2>
    <p>Enter your email to receive a reset link</p>
    <div class="form-group">
      <label for="forgot-email">Email</label>
      <input
        id="forgot-email"
        type="email"
        [(ngModel)]="email"
        name="email"
        autocomplete="email"
        placeholder="you@example.com"
      />
    </div>
    <div *ngIf="error" class="error-msg" role="alert" aria-live="assertive">{{ error }}</div>
    <div *ngIf="submitted" class="success-msg" role="status" aria-live="polite">If that email exists, a reset link has been sent. Please check your inbox (and spam folder).</div>
    <button (click)="onSubmit()" [disabled]="isLoading">{{ isLoading ? "Sending..." : "Send reset link" }}</button>
    <p class="footer-link"><a routerLink="/login">← Back to sign in</a></p>
  </div>
</div>
