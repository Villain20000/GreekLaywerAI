<div class="forgot-container">
  <div class="forgot-box">
    <h2>{{ 'auth.forgot.title' | translate }}</h2>
    <p>{{ 'auth.forgot.subtitle' | translate }}</p>
    <div class="form-group">
      <label for="forgot-email">{{ 'common.email' | translate }}</label>
      <input
        id="forgot-email"
        type="email"
        [(ngModel)]="email"
        name="email"
        autocomplete="email"
        [attr.placeholder]="'auth.login.emailPlaceholder' | translate"
      />
    </div>
    <div *ngIf="error" class="error-msg" role="alert" aria-live="assertive">{{ error }}</div>
    <div *ngIf="submitted" class="success-msg" role="status" aria-live="polite">{{ 'auth.forgot.success' | translate }}</div>
    <button (click)="onSubmit()" [disabled]="isLoading">{{ (isLoading ? 'auth.forgot.sending' : 'auth.forgot.submit') | translate }}</button>
    <p class="footer-link"><a routerLink="/login">{{ 'common.backToSignIn' | translate }}</a></p>
  </div>
</div>
